name: Self-Coach

on:
  schedule:
    - cron: "0 1 * * *"  # 1am UTC (9am MYT) — daily coaching run
    - cron: "0 9 * * *"  # 9am UTC (5pm MYT) — daily revert check
  workflow_dispatch:
    inputs:
      job:
        description: "Which job to run"
        required: false
        default: "coach"
        type: choice
        options:
          - coach
          - revert

permissions:
  contents: write

jobs:
  coach:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'coach' || github.event_name == 'schedule' && github.event.schedule == '0 1 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Run self-coach
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          COACH_MIN_CONVOS: ${{ vars.COACH_MIN_CONVOS || '3' }}
        run: npx tsx packages/bot/src/coach-auto.ts

  revert:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'revert' || github.event_name == 'schedule' && github.event.schedule == '0 9 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Run revert check
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: npx tsx packages/bot/src/coach-revert.ts
